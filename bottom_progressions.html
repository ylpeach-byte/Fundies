<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061a13"><title>Staley Wrestling | Bottom Progressions</title><link rel="icon" href="./favicon.ico"><style>
:root{--bg:#061a13;--panel:#123b2b;--lime:#c9ed6a;--muted:#b9cdbd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:white;font-family:Inter,Arial,sans-serif}body{background:radial-gradient(ellipse at 70% 0%,#205c3b 0%,#061a13 60%)}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.app{min-height:100dvh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px clamp(15px,3vw,44px);background:#061b14;border-bottom:1px solid #ffffff23}.brand{font-weight:900;letter-spacing:.04em}.brand span{display:block;color:var(--lime);font-size:11px;letter-spacing:.2em}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.nav a{border:1px solid #5b806b;border-radius:9px;color:white;background:#143729;text-decoration:none;padding:10px 13px;font-size:13px;font-weight:800}.nav button:hover,.nav a:hover{background:#26553c}main{width:min(1600px,100%);margin:auto;flex:1;display:flex;flex-direction:column;padding:clamp(15px,2.5vw,38px);gap:18px}.eyebrow{color:var(--lime);font-size:clamp(12px,1.4vw,19px);letter-spacing:.15em;font-weight:900;text-transform:uppercase}.headline{font-size:clamp(32px,5.5vw,78px);font-style:italic;letter-spacing:-.055em;text-transform:uppercase;line-height:1;margin:8px 0}.sub{color:var(--muted);font-size:clamp(14px,1.3vw,20px)}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;flex:1;align-content:center}.menu button{background:#123b2b;color:white;border:2px solid #357e4d;border-radius:20px;min-height:clamp(145px,24vh,240px);text-align:left;padding:clamp(20px,3vw,42px);transition:transform .12s}.menu button:hover{transform:translateY(-3px);border-color:var(--lime)}.num{color:var(--lime);font-size:clamp(18px,2.4vw,34px);font-weight:950}.menu-title{font-size:clamp(27px,4vw,59px);font-weight:950;font-style:italic;line-height:1.05;text-transform:uppercase;margin:15px 0 8px}.menu-sub{color:#bdd3c5;font-size:15px}.slide{display:none;flex:1;flex-direction:column;gap:12px;min-height:0}.slide.active{display:flex}.menu.hidden{display:none}.slidehead{display:flex;align-items:start;justify-content:space-between;gap:20px}.slidehead .headline{max-width:calc(100% - 245px)}.timer{flex:none;border:3px solid #8df447;background:#071d15;border-radius:18px;padding:10px 14px;text-align:center;min-width:205px}.timer-label{font-size:12px;letter-spacing:.12em;color:#c7d9c8;font-weight:900}.clock{font-size:clamp(45px,5vw,78px);font-weight:950;font-style:italic;line-height:1;font-variant-numeric:tabular-nums}.timer-controls{display:flex;gap:7px;justify-content:center;margin-top:7px}.timer-controls button{background:var(--lime);border:0;border-radius:8px;color:#10251a;font-size:12px;font-weight:900;padding:8px 12px}.timer-controls button.secondary{background:#214937;color:white;border:1px solid #5c856b}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(120px,1fr);gap:clamp(12px,2vw,26px);flex:1;min-height:0}.step{background:linear-gradient(140deg,#e6ffe9,#b9edc5);border:3px solid #1b6b42;border-radius:18px;color:#092c1b;display:flex;flex-direction:column;overflow:hidden;min-height:110px}.step:nth-child(even){background:linear-gradient(140deg,#f8faf8,#dce6df);border-color:#849b89}.step-top{display:flex;align-items:center;gap:12px;background:#07562e;color:white;padding:8px 14px;font-weight:950;font-size:clamp(13px,1.5vw,23px);font-style:italic;text-transform:uppercase}.step:nth-child(even) .step-top{background:#293c31}.bubble{width:clamp(36px,3.6vw,56px);height:clamp(36px,3.6vw,56px);border:2px solid var(--lime);border-radius:50%;display:grid;place-items:center;font-size:clamp(20px,2.2vw,32px);font-style:normal}.step-text{flex:1;display:grid;place-items:center;text-align:center;padding:14px;font-weight:950;font-style:italic;text-transform:uppercase;font-size:clamp(21px,3.2vw,53px);line-height:1.08;overflow-wrap:anywhere}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px clamp(15px,3vw,44px);border-top:1px solid #ffffff24;background:#061b14}.footer button{border:0;background:#f1f8ee;color:#10251a;font-weight:900;border-radius:10px;padding:13px 18px}.footer button.next{background:var(--lime)}.footer button:disabled{opacity:.35}.footer .count{color:var(--muted);font-size:13px}.notice{background:#143c2b;border:1px solid #427d54;border-radius:12px;padding:14px 18px;font-weight:800;color:var(--lime)}.empty{border:2px dashed #5b806b;border-radius:16px;display:grid;place-items:center;flex:1;min-height:250px;color:#c4d6c8;font-size:clamp(19px,3vw,34px);text-align:center;padding:25px}.hide{display:none!important}@media(max-width:700px){.topbar{align-items:flex-start}.brand{font-size:13px}.brand span{font-size:9px}.nav button,.nav a{padding:8px;font-size:11px}.menu{gap:10px}.menu button{min-height:130px;padding:16px}.menu-title{font-size:clamp(21px,5vw,34px)}.slidehead .headline{max-width:none;font-size:clamp(26px,6vw,40px)}.slidehead{flex-direction:column}.timer{width:100%;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px}.timer-label{text-align:left}.clock{font-size:40px;grid-row:2}.timer-controls{grid-column:2;grid-row:1/span 2;margin:0}.steps{gap:9px;grid-auto-rows:minmax(125px,1fr)}.step{min-height:125px}.step-top{font-size:11px;padding:5px;gap:5px}.bubble{height:28px;width:28px;font-size:16px}.step-text{font-size:clamp(16px,4.1vw,27px);padding:8px}.footer{padding:9px 12px}.footer button{padding:10px}.footer .count{font-size:11px}}@media(max-width:370px){.menu{grid-template-columns:1fr}.step-text{font-size:15px}}@media(min-width:900px) and (min-height:700px){.app{height:100dvh}.slide{overflow:hidden}.steps{overflow:auto}.step-text{font-size:clamp(20px,3.1vw,48px)}}
.step{opacity:.45;transition:opacity .15s,box-shadow .15s,transform .15s}.step.current{opacity:1;box-shadow:0 0 0 4px var(--lime);transform:scale(1.012)}.step.completed{opacity:.7}.rep-strip{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 0;font-weight:900;color:var(--lime)}.rep-dot{display:inline-grid;place-items:center;width:35px;height:35px;border:2px solid var(--lime);border-radius:50%;color:var(--lime)}.rep-dot.done{background:var(--lime);color:#09261b}.rep-instruction{font-size:clamp(12px,1.3vw,17px);color:#d9e8db;text-align:center}.step[aria-current="step"]{outline:0}@media(max-width:700px){.step.current{transform:none;box-shadow:0 0 0 3px var(--lime)}}
</style></head><body><div class="app"><header class="topbar"><div class="brand"><span>STALEY WRESTLING</span>Bottom Progressions</div><nav class="nav"><a href="./index.html">⌂ Home</a><button id="menuBtn">Progressions</button><button id="fullBtn">⛶ Fullscreen</button></nav></header><main><section id="intro"><div class="eyebrow">Staley Wrestling • Big Man Bible</div><h1 class="headline">Bottom Progressions</h1><div class="sub">Choose a progression. Use the right arrow or presenter Down button to advance.</div></section><div class="menu" id="menu"></div><section class="slide" id="slide"><div class="slidehead"><div><div class="eyebrow" id="eyebrow"></div><h1 class="headline" id="drillTitle"></h1><div class="sub" id="drillDetail"></div></div><div class="timer"><div class="timer-label" id="timerStatus">ROUND TIMER</div><div class="clock" id="clock">0:45</div><div class="timer-controls"><button id="start">Start</button><button class="secondary" id="reset">Reset</button></div></div></div><div class="steps" id="steps"></div><div class="rep-strip" id="repStrip" aria-live="polite"></div><div class="rep-instruction" id="repInstruction"></div><div class="notice" id="notice"></div></section></main><footer class="footer"><button id="prev">← Previous</button><div class="count" id="counter">Select a progression · Space: timer · F: fullscreen</div><button class="next" id="next">Next →</button></footer></div><script>
const DRILLS=[{"name": "Quad Pod", "detail": "3 Each", "sides": [{"side": "Right Side", "steps": ["Rotate Hands-Swisher Feet (On Air)", "Quad Pod-Knee Slide (On Air)", "Hand in holster Run out  (On Air)", "Whistle Starts With A Partner-Escape"]}, {"side": "Left Side", "steps": ["Rotate Hands-Swisher Feet (On Air)", "Quad Pod-Knee Slide (On Air)", "Hand in holster Run out  (On Air)", "Whistle Starts With A Partner-Escape"]}]}, {"name": "Speed Stand Up", "detail": "3 Each", "sides": [{"side": "Right Side", "steps": ["Clear Arm Outside Step-Throw hand (On Wall)", "Clear Arm Outside Step-Throw hand (Partner)"]}, {"side": "Left Side", "steps": ["Clear Arm Outside Step-Throw hand (On Wall)", "Clear Arm Outside Step-Throw hand (Partner)", "Return-Knees Up- Speed Stand Up"]}]}, {"name": "Half Defense", "detail": "3 Each", "sides": [{"side": "Right Side", "steps": ["Head Down Window Open", "Parter Start-Run Feet", "Close the window away Build opposite Hip"]}, {"side": "Left Side", "steps": ["Head Down Window Open", "Parter Start-Run Feet", "Close the window away Build opposite Hip", "Finish Partner Choice 2 Each Side"]}]}, {"name": "Crossface", "detail": "3 Each", "sides": [{"side": "Right Side", "steps": ["Head up arm posted", "Parter Start-Run Feet", "Attack Fingers-Keep hand build-rotate"]}, {"side": "Left Side", "steps": ["Head up arm posted", "Parter Start-Run Feet", "Attack Fingers-Keep hand Post-rotate Escape"]}]}];const KIND='bottom';const menu=document.getElementById('menu'),slide=document.getElementById('slide'),intro=document.getElementById('intro');let stepIndex=0,repCount=0;let idx=-1,side=0,remaining=45,running=false,interval=null,deadline=0,ctx=null,lastUp=0;
function toneWhistle(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(1750,ctx.currentTime);o.frequency.linearRampToValueAtTime(2000,ctx.currentTime+.22);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.09,ctx.currentTime+.018);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.32);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.34)}catch(e){}}
function displayClock(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('clock').textContent=m+':'+String(s).padStart(2,'0')}
function stop(){clearInterval(interval);interval=null;running=false;document.getElementById('start').textContent='Start'}function reset(){stop();remaining=45;displayClock();document.getElementById('timerStatus').textContent='ROUND TIMER'}function tick(){remaining=Math.max(0,Math.ceil((deadline-performance.now())/1000));displayClock();if(!remaining){stop();toneWhistle();document.getElementById('timerStatus').textContent='ROUND COMPLETE'}}function toggleTimer(){if(idx<0)return;if(running){remaining=Math.max(0,Math.ceil((deadline-performance.now())/1000));stop();return}if(remaining===0)remaining=45;deadline=performance.now()+remaining*1000;running=true;document.getElementById('start').textContent='Pause';document.getElementById('timerStatus').textContent='ROUND RUNNING';toneWhistle();interval=setInterval(tick,100)}
function makeStep(text,n){const el=document.createElement('div');el.className='step';const head=document.createElement('div');head.className='step-top';const badge=document.createElement('span');badge.className='bubble';badge.textContent=n;head.append(badge,document.createTextNode('STEP '+n));const body=document.createElement('div');body.className='step-text';body.textContent=text;el.append(head,body);return el}
function render(){reset();stepIndex=0;repCount=0;const inMenu=idx<0;menu.classList.toggle('hidden',!inMenu);intro.classList.toggle('hide',!inMenu);slide.classList.toggle('active',!inMenu);document.getElementById('prev').disabled=inMenu;document.getElementById('next').disabled=inMenu;if(inMenu){document.getElementById('repStrip').innerHTML='';document.getElementById('repInstruction').textContent='';document.getElementById('counter').textContent='Choose a progression · F: fullscreen';return}const d=DRILLS[idx],steps=document.getElementById('steps'),notice=document.getElementById('notice');steps.innerHTML='';document.getElementById('eyebrow').textContent='Bottom Progressions · '+String(idx+1).padStart(2,'0')+' / 04';document.getElementById('drillTitle').textContent=d.name;notice.classList.add('hide');if(KIND==='bottom'){const s=d.sides[side];document.getElementById('drillDetail').textContent=d.detail+' · '+(s?s.side:'');if(s){s.steps.forEach((t,i)=>steps.append(makeStep(t,i+1)));if(s.steps.length===0){steps.innerHTML='<div class="empty">No steps entered in worksheet</div>'}}else{steps.innerHTML='<div class="empty">No side entered in worksheet</div>'}document.getElementById('counter').textContent='Progression '+(idx+1)+' of 4 · '+(side+1)+' / '+d.sides.length+' sides';updateRepDisplay()}else{document.getElementById('drillDetail').textContent=d.name.includes('Both Sides')?'Both sides':'';if(d.steps.length){const last=d.steps[d.steps.length-1];const hasFinish=/shot finishes/i.test(last);d.steps.slice(0,hasFinish?-1:undefined).forEach((t,i)=>steps.append(makeStep(t,i+1)));if(hasFinish){notice.classList.remove('hide');notice.textContent='FINAL REP · '+last}}else{steps.innerHTML='<div class="empty">No technique steps entered in the worksheet for Double</div>'}document.getElementById('counter').textContent='Progression '+(idx+1)+' of 4'}}
function updateRepDisplay(){
 if(idx<0)return;
 const cards=[...document.getElementById('steps').querySelectorAll('.step')];
 cards.forEach((el,i)=>{el.classList.toggle('current',i===stepIndex);el.classList.toggle('completed',i<stepIndex);if(i===stepIndex)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current')});
 const strip=document.getElementById('repStrip');strip.innerHTML='';
 const heading=document.createElement('span');heading.textContent='STEP '+(stepIndex+1)+' · REPS';strip.append(heading);
 for(let i=1;i<=3;i++){const dot=document.createElement('span');dot.className='rep-dot'+(i<=repCount?' done':'');dot.textContent=i;strip.append(dot)}
 const done=repCount===3;
 document.getElementById('repInstruction').textContent=done?'Three whistles complete · CLICK TO ADVANCE TO THE NEXT STEP':'Click / presenter Down / Right Arrow = whistle for rep '+(repCount+1);
 document.getElementById('next').textContent=done?'Next Step →':'Whistle '+(repCount+1)+' →';
 document.getElementById('counter').textContent=DRILLS[idx].name+' · '+DRILLS[idx].sides[side].side+' · Step '+(stepIndex+1)+' of '+cards.length+' · '+repCount+'/3 whistles';
}
function openDrill(i){idx=i;side=0;render()}
function advanceSideOrDrill(){if(side<DRILLS[idx].sides.length-1){side++;render()}else if(idx<DRILLS.length-1){openDrill(idx+1)}else{home()}}
function next(){
 if(idx<0){openDrill(0);return}
 if(repCount<3){toneWhistle();repCount++;updateRepDisplay();return}
 const count=DRILLS[idx].sides[side].steps.length;
 if(stepIndex<count-1){stepIndex++;repCount=0;updateRepDisplay()}
 else advanceSideOrDrill();
}
function prev(){
 if(idx<0)return;
 if(repCount>0){repCount=0;updateRepDisplay();return}
 if(stepIndex>0){stepIndex--;repCount=0;updateRepDisplay();return}
 if(side>0){side--;render();stepIndex=Math.max(0,DRILLS[idx].sides[side].steps.length-1);updateRepDisplay()}
 else if(idx>0){idx--;side=DRILLS[idx].sides.length-1;render();stepIndex=Math.max(0,DRILLS[idx].sides[side].steps.length-1);updateRepDisplay()}
 else home();
}
function home(){idx=-1;render()}
DRILLS.forEach((d,i)=>{const b=document.createElement('button');const n=document.createElement('div');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('div');t.className='menu-title';t.textContent=d.name;const sub=document.createElement('div');sub.className='menu-sub';sub.textContent=KIND==='bottom'?'3 each · Right and left sides':(d.steps.length?d.steps.length+' worksheet entries':'No steps entered yet');b.append(n,t,sub);b.addEventListener('click',()=>openDrill(i));menu.append(b)});document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('start').onclick=toggleTimer;document.getElementById('reset').onclick=reset;document.getElementById('menuBtn').onclick=home;document.getElementById('fullBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};document.addEventListener('keydown',e=>{const key=e.key;if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp',' ','f','F','r','R'].includes(key))e.preventDefault();if(key==='ArrowRight'||key==='ArrowDown'){next()}else if(key==='ArrowLeft'||key==='ArrowUp'){if(key==='ArrowUp'&&performance.now()-lastUp<650){home();lastUp=0}else{prev();lastUp=performance.now()}}else if(key===' '){toggleTimer()}else if(key==='r'||key==='R'){reset()}else if(key==='f'||key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}});render();
</script></body></html>
