</style></head><body><div class="app"><header class="topbar"><a class="brand" href="./index.html" title="Return to Fundies home" aria-label="Return to Staley Wrestling Fundies home"><div class="mark" aria-hidden="true">S</div><div><div class="brandtop">Staley Wrestling</div><div class="brandname">TOP/BOTTOM FUNDIES</div></div></a><div class="nav-right"><a class="remote-home" href="./index.html" aria-label="Return to practice tools home">⌂ HOME</a><span class="mini" id="topcount">SLIDE 1 / 7</span><button class="iconbtn" id="sound" title="Toggle whistle" aria-label="Toggle whistle">🔊 Sound</button><button class="iconbtn" id="fullscreen" title="Full screen">⛶ Full screen</button><button class="iconbtn" id="menu" title="Choose drill">☰ Drills</button></div></header><main class="main"><section class="slide" id="slide" aria-live="polite"></section></main><footer class="bottom"><div class="nextprev"><button class="navbtn" id="prev">← Previous</button><button class="navbtn primary" id="next">Next →</button></div><div class="progress" id="progress"></div><div class="copyright"><strong>© 2026 Staley Wrestling. All Rights Reserved.</strong><br>Staley High School Wrestling Program</div><div class="footlinks"><span class="hint">→ advance/start A/start B/next · ← previous · Space pause · R reset · F full screen</span></div></footer></div><div class="menuoverlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="menuheading"><div class="menubox"><div class="menutop"><h2 id="menuheading">Choose a drill</h2><button class="iconbtn" id="closemenu">✕ Close</button></div><div class="menuitems" id="menuitems"></div></div></div><script>

{title:'TW Ankle',duration:45,a:['TW Ankle','Far Knee / Far Ankle to Half'],b:['Build to Free Leg','Close Window, Look Away / Build Away'],focus:'TW Ankle',label:'TW Ankle'},

let startedOnSlide=false;let phase="A";let index=0, remaining=0, running=false, deadline=0, tickHandle=null, soundEnabled=true, audioCtx=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(s){s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}let preparing=false, cueToken=0;

}function updateTimer(){const t=$('#clock');if(!t)return;t.textContent=fmt(remaining);t.classList.toggle('finished',remaining===0);const btn=$('#play');if(btn)btn.textContent=preparing?'■ Cancel Calls':running?'Ⅱ Pause':phase==='switch'?'▶ Start B':phase==='done'?'↺ Restart A':`▶ Start ${phase}`;const ring=$('#timerstatus');if(ring)ring.textContent=preparing?`WRESTLER ${phase} · START COMMANDS`:running?`WRESTLER ${phase} · COUNTING DOWN`:phase==='switch'?'REPOSITION · PRESS → TO START B':phase==='done'?'BOTH WRESTLERS COMPLETE':`WRESTLER ${phase} · READY`;const who=$('#wrestlerphase');if(who){who.textContent=phase==='switch'?'SWITCH WRESTLERS':phase==='done'?'DRILL COMPLETE':`WRESTLER ${phase}`;who.classList.toggle('switching',phase==='switch');}const next=$('#next');if(next&&slides[index].duration)next.textContent=phase==='done'?'Next Drill →':phase==='switch'?'Start Wrestler B →':preparing?'Calling Wrestlers…':running?'Timer Running':'Start / Resume →';}
function countdown(){if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);if(remaining===0){stop();tone();phase=phase==='A'?'switch':'done'}updateTimer()}

function buildSequence(d){

 for(let j=0;j<max;j++){
   if(j<a.length)steps.push({person:'A',role:d.reverse?'BOTTOM':'TOP',action:a[j]});

 }
 // Neutral has no top/bottom roles; use A MAN / B MAN only.
 const neutral=document.title.toLowerCase().includes('neutral');
 return `<div style="width:100%;display:flex;flex-direction:column;justify-content:center"><div class="sequence ${['','one','two','three','four','five','six','seven','eight'][Math.min(steps.length,8)]}">${steps.map((st,i)=>`<div class="stepcard ${st.person==='B'?'b':'a'}"><div class="stepnum">${i+1}</div><div class="stephead">${st.person} MAN${neutral?'':`<small>${st.role}</small>`}</div><div class="stepaction">${esc(st.action)}</div></div>`).join('')}</div><div class="sequence-note">Alternate roles, each round.</div></div>`;
}
function buildRole(name,actions,cl=''){return `<div class="role ${cl}"><div class="role-head">${name}</div><div class="role-body">${actions.map(a=>`<div class="action">${esc(a)}</div>`).join('')}</div></div>`}function render(){stop();startedOnSlide=false;phase="A";let d=slides[index];remaining=d.duration||0;$('#topcount').textContent=`SLIDE ${index+1} / ${slides.length}`;$('#prev').disabled=index===0;$('#next').disabled=index===slides.length-1;$('#next').textContent=index===slides.length-1?'Finish ✓':'Next →';let html='';if(d.type==='intro'||d.type==='outro'){html=`<div class="slide-content"><div class="number">S</div><div class="intro"><div class="eyebrow">STALEY WRESTLING  /  ${d.type==='intro'?'PRACTICE PRESENTATION':'SESSION COMPLETE'}</div><h1 class="title">TOP/BOTTOM<br><span class="accent">FUNDIES</span></h1><div class="introbottom">${d.type==='intro'?'5 DRILLS  &nbsp;•&nbsp;  TWO TIMED ROUNDS PER DRILL':'Josh Lorenson & Clinton Minnick'}</div>${d.type==='intro'?'<p class="subtitle">Press → for the next drill, then → to start A. Reposition after the end whistle, then → to start B.</p>':''}</div></div><div class="footerstrip"><span class="status">JOSH LORENSON &amp; CLINTON MINNICK</span><a target="_blank" rel="noopener" class="source" href="${source}">Original Google Slides ↗</a></div>`}else{html=`<div class="slide-content"><div class="number">${String(index).padStart(2,'0')}</div><div class="eyebrow">TOP/BOTTOM FUNDIES &nbsp;/&nbsp; DRILL ${String(index).padStart(2,'0')} OF 05</div><h1 class="title">${esc(d.title)}</h1><div class="timerunit"><div class="wrestlerphase" id="wrestlerphase">WRESTLER A</div><div><div class="status" id="timerstatus">READY WHEN YOU ARE</div><div class="time" id="clock">${fmt(remaining)}</div></div><button class="start" id="play" title="Space to start or pause">▶ Start</button><button class="reset" id="reset" title="R to reset">↺</button></div><div class="contentarea">${d.single?`<div class="single"><div class="singletext">${esc(d.single)}</div></div>`:buildSequence(d)}</div></div><div class="footerstrip"><div class="focus"><div class="focustitle">FOCUS</div><div class="focustext">${esc(d.focus)}</div></div></div></div>`}$('#slide').innerHTML=html;$('#progress').innerHTML=slides.map((_,i)=>`<button class="dot ${i===index?'active':''}" data-to="${i}" title="Slide ${i+1}"></button>`).join('');document.querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.to)));if(d.duration){$('#play').addEventListener('click',playPause);$('#reset').addEventListener('click',reset)}updateTimer()}function go(i){index=Math.max(0,Math.min(slides.length-1,i));render();closeMenu()}function advanceOrStart(){if(slides[index].duration){if(phase==='done'){go(index+1)}else if(!running&&!preparing){playPause()}/* Ignore forward while commands or countdown are running to prevent accidental skips. */}else if(index<slides.length-1){go(index+1)}}function openMenu(){const cont=$('#menuitems');cont.innerHTML=slides.map((s,i)=>`<button class="menuitem ${i===index?'current':''}" data-menu-index="${i}">${i+1}. ${esc(s.label)}<small>${s.duration?`${s.duration} seconds`:s.type==='intro'?'Title slide':'Closing slide'}</small></button>`).join('');cont.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.menuIndex)));$('#overlay').classList.add('open')}function closeMenu(){$('#overlay').classList.remove('open')}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}$('#prev').onclick=()=>go(index-1);$('#next').onclick=advanceOrStart;$('#menu').onclick=openMenu;$('#closemenu').onclick=closeMenu;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeMenu()};$('#sound').onclick=()=>{soundEnabled=!soundEnabled;if(!soundEnabled&&preparing){cancelCalls();updateTimer()}$('#sound').textContent=soundEnabled?'🔊 Sound':'🔇 Muted'};$('#fullscreen').onclick=full;document.addEventListener('keydown',e=>{if(['BUTTON','INPUT'].includes(document.activeElement.tagName)&&e.key===' ')document.activeElement.blur();if($('#overlay').classList.contains('open')){if(e.key==='Escape')closeMenu();return}if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();if(!e.repeat)advanceOrStart()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}else if(e.code==='Space'){e.preventDefault();playPause()}else if(e.key.toLowerCase()==='r'){reset()}else if(e.key.toLowerCase()==='f'){full()}else if(e.key==='Escape'){closeMenu()}});render();
</script><script>window.staleyPrevious=()=>go(index-1);window.staleySelect=()=>{if(document.querySelector('#overlay')?.classList.contains('open')){document.querySelector('#closemenu')?.click();return;}advanceOrStart();};</script>
<script>
(function(){
 let lastLeft=0,pending=null;
 const home=()=>{window.location.href='./index.html'};
 window.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(!['ArrowLeft','PageUp'].includes(e.key))return;
  e.preventDefault();e.stopImmediatePropagation();
  if(e.repeat)return;
  const now=performance.now();
  if(pending&&now-lastLeft<430){clearTimeout(pending);pending=null;lastLeft=0;home();return}
  if(pending)clearTimeout(pending);
  lastLeft=now;
  pending=setTimeout(()=>{
   pending=null;
   if(window.staleyPrevious)window.staleyPrevious();
  },430);
 },true);
 // Presenter square button may send Tab rather than Enter.
 window.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
  if(e.key!=='Tab')return;
  e.preventDefault();e.stopImmediatePropagation();
  if(window.staleySelect)window.staleySelect();
 },true);
})();
</script>

<script>
/* A real WAV file plays through HTMLAudioElement on iOS, Android, and desktop.
   A user gesture primes the same audio element for automatic timer-end playback. */
(function(){
 const a=new Audio('./referee-whistle.wav');a.preload='auto';a.volume=1;
 window.staleyWhistleAudio=a;
 let primed=false;
 function prime(){
   if(primed)return;primed=true;
   const oldVolume=a.volume;a.volume=0;
   const p=a.play();
   if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.volume=oldVolume;}).catch(()=>{primed=false;a.volume=oldVolume;});
   else {a.pause();a.currentTime=0;a.volume=oldVolume;}
 }
 document.addEventListener('touchstart',prime,{capture:true,once:true,passive:true});
 document.addEventListener('pointerdown',prime,{capture:true,once:true,passive:true});
 document.addEventListener('keydown',prime,{capture:true,once:true});
 const soundButton=document.getElementById('sound');
 if(soundButton){
   const test=document.createElement('button');test.type='button';
   test.className='control';test.textContent='♫ Test Whistle';
   test.setAttribute('aria-label','Test referee whistle');
   test.addEventListener('click',()=>{primed=true;tone();});
   soundButton.insertAdjacentElement('afterend',test);
 }
})();
</script>

<script>
/* Fit each action to the largest readable font size that fits its own box. */
(function(){
 function fit(){
  document.querySelectorAll('.stepaction').forEach(el=>{
   const width=el.clientWidth,height=el.clientHeight;
   if(!width||!height)return;
   let size=Math.min(94,Math.max(24,width/5));
   const min=window.innerWidth<550?13:window.innerWidth<850?18:22;
   el.style.fontSize=size+'px';
   for(let i=0;i<75&&(el.scrollHeight>height+1||el.scrollWidth>width+1);i++){
    size=Math.max(min,size-1.3);el.style.fontSize=size+'px';
    if(size===min)break;
   }
  });
 }
 const slide=document.getElementById('slide');
 if(slide)new MutationObserver(fit).observe(slide,{childList:true,subtree:true});
 window.addEventListener('resize',fit);
 requestAnimationFrame(fit);
})();
</script>
