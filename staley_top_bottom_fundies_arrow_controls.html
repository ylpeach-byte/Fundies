:root{--bg:#061a13;--green:#0b4d2d;--lime:#c9ed6a;--text:#f6faf5;--muted:#b6cabe;--line:#254b3a;--panel:#103426;--surface:#10271f;--yellow:#ffe98a}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(ellipse at 80% -30%,#236e49 0,transparent 51%),var(--bg);overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,52px);border-bottom:1px solid #ffffff22;background:#061e16dd;gap:18px}.brand{display:flex;align-items:center;gap:14px;white-space:nowrap}.mark{height:42px;width:42px;display:grid;place-items:center;border:2px solid var(--lime);border-radius:11px;color:var(--lime);font-size:25px;font-weight:950;letter-spacing:-3px}.brandtop{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);font-weight:800}.brandname{font-size:19px;font-weight:850;letter-spacing:-.04em}.nav-right{display:flex;align-items:center;gap:15px}.mini{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:750;text-transform:uppercase}.iconbtn{border:1px solid #ffffff3b;border-radius:11px;background:#ffffff0b;color:var(--text);padding:11px 15px;font-weight:800}.iconbtn:hover{background:#ffffff20}.main{flex:1;display:flex;min-height:0;padding:clamp(13px,2.2vh,28px) clamp(18px,3.1vw,55px)}.slide{flex:1;min-width:0;border:1px solid #ffffff1c;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(155deg,#143b2c 0%,#081e17 55%,#091e16 100%);box-shadow:0 16px 80px #0006;position:relative}.slide:after{content:"";position:absolute;right:-150px;bottom:-300px;height:550px;width:550px;border:95px solid #ffffff06;border-radius:100%;pointer-events:none}.slide-content{padding:clamp(25px,3vw,50px);flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}.eyebrow{font-size:clamp(11px,1.05vw,17px);color:var(--lime);text-transform:uppercase;letter-spacing:.24em;font-weight:850;margin-bottom:14px}.title{font-size:clamp(34px,5.2vw,86px);font-weight:900;line-height:1.02;letter-spacing:-.06em;margin:0;max-width:1200px}.subtitle{font-size:clamp(17px,1.7vw,25px);color:#c6dbc9;margin-top:18px;line-height:1.4}.contentarea{margin-top:clamp(20px,3vh,37px);display:flex;flex:1;min-height:0;gap:20px}.single{display:flex;align-items:center;justify-content:center;min-height:170px;flex:1;background:linear-gradient(110deg,#ffffff0a,#ffffff03);border:1px solid #ffffff20;border-radius:18px;padding:30px}.singletext{font-size:clamp(32px,4vw,68px);font-weight:850;text-align:center;line-height:1.12;letter-spacing:-.04em}.role{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:18px;background:#f7faf5;color:#0a2519;overflow:hidden}.role-head{padding:13px 24px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(13px,1.3vw,19px);color:#fff;background:#105c38}.role.b .role-head{background:#172d24}.role-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vh,29px);padding:clamp(18px,2.5vw,40px)}.action{font-size:clamp(23px,2.6vw,45px);font-weight:850;letter-spacing:-.045em;line-height:1.16}.action+.action{border-top:2px solid #d8e5d8;padding-top:clamp(15px,2vh,27px)}.footerstrip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px clamp(25px,3vw,50px);background:#06190f;border-top:1px solid #ffffff17;min-height:90px;position:relative;z-index:1}.focus{max-width:75%;display:flex;flex-direction:column;gap:5px}.focustitle{color:var(--lime);font-size:11px;letter-spacing:.2em;font-weight:900}.focustext{font-size:clamp(15px,1.6vw,25px);font-weight:750;line-height:1.2}.timerunit{display:flex;align-items:center;gap:12px;margin-left:auto}.time{min-width:100px;text-align:right;font-variant-numeric:tabular-nums;font-size:clamp(31px,3.1vw,50px);font-weight:900;letter-spacing:-.06em}.time.finished{color:var(--lime)}.start{border:none;background:var(--lime);color:#10251a;font-weight:950;padding:17px 25px;border-radius:13px;min-width:115px}.start:hover{background:#dcff94}.reset{border:1px solid #ffffff4d;background:transparent;color:#f5faf6;padding:16px;border-radius:12px;font-weight:800}.copyright{flex-shrink:0;font-size:11px;color:#b6cabe;text-align:center;line-height:1.45;white-space:nowrap}.copyright strong{color:#fff;font-weight:700}.bottom{height:95px;padding:12px clamp(18px,3vw,52px);display:flex;align-items:center;justify-content:space-between;gap:18px}.nextprev{display:flex;align-items:center;gap:12px}.navbtn{background:#f4f9f2;border:0;color:#0b2418;border-radius:13px;font-size:16px;font-weight:900;padding:16px 24px}.navbtn:disabled{opacity:.3;cursor:default}.navbtn.primary{background:var(--lime)}.progress{display:flex;gap:7px;align-items:center;justify-content:center;flex:1}.dot{width:24px;height:6px;border:none;border-radius:20px;background:#3b5b49;padding:0;transition:.2s}.dot.active{width:45px;background:var(--lime)}.notes{color:#a8c5b2;font-size:12px}.intro{margin:auto 0}.intro .title{font-size:clamp(60px,9vw,155px);line-height:.95}.intro .accent{color:var(--lime)}.introbottom{margin-top:35px;font-size:clamp(16px,2.1vw,29px);color:var(--muted)}.number{position:absolute;right:42px;top:30px;color:#ffffff0a;font-size:clamp(120px,17vw,300px);font-weight:900;line-height:1;pointer-events:none}.menuoverlay{position:fixed;z-index:30;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}.menuoverlay.open{display:flex}.menubox{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0c291d;border:1px solid #4a755b;border-radius:22px;padding:30px}.menutop{display:flex;justify-content:space-between;align-items:center}.menubox h2{margin:0 0 20px;font-size:27px}.menuitems{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menuitem{border:1px solid #446653;color:#fff;background:#173b2b;text-align:left;border-radius:12px;padding:17px;font-weight:750}.menuitem.current{border:2px solid var(--lime)}.menuitem small{display:block;color:#a9c4af;margin-top:6px}.source{color:var(--lime);font-size:12px;text-decoration:underline}.footlinks{display:flex;align-items:center;gap:10px}.hint{font-size:12px;color:#a8c9b0}.status{color:var(--muted);font-size:12px;white-space:nowrap} @media(max-width:920px){.topbar{height:60px}.brandname{font-size:15px}.brandtop{font-size:10px}.mini,.hint,.notes{display:none}.main{padding:12px}.slide-content{padding:20px}.title{font-size:clamp(29px,6vw,55px)}.contentarea{gap:9px}.role-body{padding:15px}.action{font-size:clamp(18px,3vw,30px)}.footerstrip{min-height:82px;padding:12px 20px}.focus{max-width:60%}.time{min-width:70px}.start{padding:13px;min-width:75px}.bottom{height:80px;padding:12px}.navbtn{padding:13px}.menuitems{grid-template-columns:1fr}}@media(max-height:650px){.topbar{height:51px}.bottom{height:65px}.slide-content{padding:18px}.eyebrow{margin-bottom:5px}.title{font-size:clamp(26px,4vw,57px)}.contentarea{margin-top:13px}.role-body{padding:13px}.action{font-size:clamp(20px,2.2vw,33px)}.footerstrip{min-height:70px;padding:7px 25px}.time{font-size:32px}.start,.reset{padding:10px 16px}}@media(max-width:600px){.brandname{font-size:12px}.mark{width:34px;height:34px;font-size:18px}.slide{border-radius:14px}.contentarea{flex-direction:column;overflow:auto}.role-body{padding:15px;gap:10px}.action{font-size:22px}.action+.action{padding-top:10px}.footerstrip{gap:10px}.focustext{font-size:13px}.focustitle{font-size:9px}.timerunit{gap:6px}.time{font-size:23px;min-width:48px}.start{min-width:auto;padding:9px}.reset{padding:9px}.progress{display:none}.copyright{font-size:9px;white-space:normal;max-width:150px}.bottom{height:75px}.navbtn{font-size:13px}.topbar{padding:0 10px}.iconbtn{padding:8px}.status{display:none}}
 .wrestlerphase{font-size:clamp(12px,1.2vw,17px);font-weight:950;letter-spacing:.08em;background:var(--lime);color:#10251a;border-radius:10px;padding:12px 15px;white-space:nowrap;text-align:center}.wrestlerphase.switching{background:var(--yellow)}@media(max-width:700px){.wrestlerphase{font-size:10px;padding:8px 6px;white-space:normal;max-width:110px}}@media(max-height:650px){.wrestlerphase{padding:7px 9px}} </style></head><body><div class="app"><header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">S</div><div><div class="brandtop">Staley Wrestling</div><div class="brandname">TOP/BOTTOM FUNDIES</div></div></div><div class="nav-right"><span class="mini" id="topcount">SLIDE 1 / 7</span><button class="iconbtn" id="sound" title="Toggle buzzer" aria-label="Toggle buzzer">🔊 Sound</button><button class="iconbtn" id="fullscreen" title="Full screen">⛶ Full screen</button><button class="iconbtn" id="menu" title="Choose drill">☰ Drills</button></div></header><main class="main"><section class="slide" id="slide" aria-live="polite"></section></main><footer class="bottom"><div class="nextprev"><button class="navbtn" id="prev">← Previous</button><button class="navbtn primary" id="next">Next →</button></div><div class="progress" id="progress"></div><div class="copyright"><strong>© 2026 Staley Wrestling. All Rights Reserved.</strong><br>Staley High School Wrestling Program</div><div class="footlinks"><span class="hint">→ advance/start A/start B/next · ← previous · Space pause · R reset · F full screen</span></div></footer></div><div class="menuoverlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="menuheading"><div class="menubox"><div class="menutop"><h2 id="menuheading">Choose a drill</h2><button class="iconbtn" id="closemenu">✕ Close</button></div><div class="menuitems" id="menuitems"></div></div></div><script>
// Drill language is taken from the original seven-slide Staley Top/Bottom Fundies Google Slides presentation.
const source='https://docs.google.com/presentation/d/1Z0a3XiqH3SrtEGvpUMH5QuhdbyuLUYOYakp5YJUtmiM/edit';
const slides=[
{type:'intro',title:'Top/Bottom Fundies',label:'Opening',coaches:'Josh Lorenson & Clinton Minnick'},
{title:'TWC to Cross Wrist',duration:45,a:['TWC to Cross Wrist','Crossface to Triceps'],b:['Elbow High / Scrape (Peel) / Hips Away','Attack Top Hand / Build'],focus:'TWC to Cross Wrist',label:'TWC / Cross Wrist'},
{title:'TW Ankle',duration:45,a:['TW Ankle','Far Knee / Far Ankle to Half'],b:['Build to Free Leg','Close Window, Look Away / Build Away'],focus:'TW Ankle',label:'TW Ankle'},
{title:'Thigh Pry (T-Pry), Spiral, Wrist Rotors',duration:45,a:['Thigh Pry (T-Pry), Spiral, Wrist Rotors','Head Lever / Wing'],b:['Cover, Roll Out, Build','Post Hand, Pressure Back, Build Away'],focus:'Thigh Pry (T-Pry), Spiral, Wrist Rotors',label:'T-Pry / Spiral'},
{title:'Outside Stand-Up',duration:30,a:['Outside Stand-Up','Knees Tight, Stand Up'],b:['Lift and Return','Repeat'],focus:'Outside Stand-Up',label:'Outside Stand-Up',reverse:true},
{title:'Spiral to Ankle Trap',duration:45,a:['Spiral to Ankle Trap'],b:['Rotate, Knee Slide Out, Quad Pod, Knee Slide, Holsters, Run Out'],focus:'Spiral to Ankle Trap',label:'Spiral / Ankle Trap'},
{type:'outro',title:'Top/Bottom Fundies',label:'Finish',coaches:'Josh Lorenson & Clinton Minnick'}
];
let startedOnSlide=false;let phase="A";let index=0, remaining=0, running=false, deadline=0, tickHandle=null, soundEnabled=true, audioCtx=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(s){s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}function stop(){running=false;if(tickHandle)clearInterval(tickHandle);tickHandle=null}function tone(){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();for(let i=0;i<3;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.25;o.type='square';o.frequency.value=660;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.19)}}catch(e){console.warn(e)}}function updateTimer(){const t=$('#clock');if(!t)return;t.textContent=fmt(remaining);t.classList.toggle('finished',remaining===0);const btn=$('#play');if(btn)btn.textContent=running?'Ⅱ Pause':phase==='switch'?'▶ Start B':phase==='done'?'↺ Restart A':`▶ Start ${phase}`;const ring=$('#timerstatus');if(ring)ring.textContent=running?`WRESTLER ${phase} · COUNTING DOWN`:phase==='switch'?'REPOSITION · PRESS → TO START B':phase==='done'?'BOTH WRESTLERS COMPLETE':`WRESTLER ${phase} · READY`;const who=$('#wrestlerphase');if(who){who.textContent=phase==='switch'?'SWITCH WRESTLERS':phase==='done'?'DRILL COMPLETE':`WRESTLER ${phase}`;who.classList.toggle('switching',phase==='switch');}const next=$('#next');if(next&&slides[index].duration)next.textContent=phase==='done'?'Next Drill →':phase==='switch'?'Start Wrestler B →':running?'Timer Running':'Start / Resume →';}
function countdown(){if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);if(remaining===0){stop();tone();phase=phase==='A'?'switch':'done'}updateTimer()}
function playPause(){let d=slides[index];if(!d.duration)return;startedOnSlide=true;if(running){remaining=Math.max(0,(deadline-performance.now())/1000);stop()}else{if(phase==='done'){phase='A';remaining=d.duration}else if(phase==='switch'){phase='B';remaining=d.duration}if(remaining<=0)remaining=d.duration;deadline=performance.now()+remaining*1000;running=true;tickHandle=setInterval(countdown,60)}updateTimer()}
function reset(){stop();phase='A';startedOnSlide=false;remaining=slides[index].duration||0;updateTimer()}
function buildRole(name,actions,cl=''){return `<div class="role ${cl}"><div class="role-head">${name}</div><div class="role-body">${actions.map(a=>`<div class="action">${esc(a)}</div>`).join('')}</div></div>`}function render(){stop();startedOnSlide=false;phase="A";let d=slides[index];remaining=d.duration||0;$('#topcount').textContent=`SLIDE ${index+1} / ${slides.length}`;$('#prev').disabled=index===0;$('#next').disabled=index===slides.length-1;$('#next').textContent=index===slides.length-1?'Finish ✓':'Next →';let html='';if(d.type==='intro'||d.type==='outro'){html=`<div class="slide-content"><div class="number">S</div><div class="intro"><div class="eyebrow">STALEY WRESTLING  /  ${d.type==='intro'?'PRACTICE PRESENTATION':'SESSION COMPLETE'}</div><h1 class="title">TOP/BOTTOM<br><span class="accent">FUNDIES</span></h1><div class="introbottom">${d.type==='intro'?'5 DRILLS  &nbsp;•&nbsp;  TWO TIMED ROUNDS PER DRILL':'Josh Lorenson & Clinton Minnick'}</div>${d.type==='intro'?'<p class="subtitle">Press → for the next drill, then → to start A. Reposition after the buzzer, then → to start B.</p>':''}</div></div><div class="footerstrip"><span class="status">JOSH LORENSON &amp; CLINTON MINNICK</span><a target="_blank" rel="noopener" class="source" href="${source}">Original Google Slides ↗</a></div>`}else{html=`<div class="slide-content"><div class="number">${String(index).padStart(2,'0')}</div><div class="eyebrow">TOP/BOTTOM FUNDIES &nbsp;/&nbsp; DRILL ${String(index).padStart(2,'0')} OF 05</div><h1 class="title">${esc(d.title)}</h1><div class="contentarea">${d.single?`<div class="single"><div class="singletext">${esc(d.single)}</div></div>`:buildRole(d.reverse?'BOTTOM':'TOP',d.a)+buildRole(d.reverse?'TOP':'BOTTOM',d.b,'b')}</div></div><div class="footerstrip"><div class="focus"><div class="focustitle">FOCUS</div><div class="focustext">${esc(d.focus)}</div></div><div class="timerunit"><div class="wrestlerphase" id="wrestlerphase">WRESTLER A</div><div><div class="status" id="timerstatus">READY WHEN YOU ARE</div><div class="time" id="clock">${fmt(remaining)}</div></div><button class="start" id="play" title="Space to start or pause">▶ Start</button><button class="reset" id="reset" title="R to reset">↺</button></div></div>`}$('#slide').innerHTML=html;$('#progress').innerHTML=slides.map((_,i)=>`<button class="dot ${i===index?'active':''}" data-to="${i}" title="Slide ${i+1}"></button>`).join('');document.querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.to)));if(d.duration){$('#play').addEventListener('click',playPause);$('#reset').addEventListener('click',reset)}updateTimer()}function go(i){index=Math.max(0,Math.min(slides.length-1,i));render();closeMenu()}function advanceOrStart(){if(slides[index].duration){if(phase==='done'){go(index+1)}else if(!running){playPause()}/* Ignore forward while countdown is running to prevent accidental skips. */}else if(index<slides.length-1){go(index+1)}}function openMenu(){const cont=$('#menuitems');cont.innerHTML=slides.map((s,i)=>`<button class="menuitem ${i===index?'current':''}" data-menu-index="${i}">${i+1}. ${esc(s.label)}<small>${s.duration?`${s.duration} seconds`:s.type==='intro'?'Title slide':'Closing slide'}</small></button>`).join('');cont.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.menuIndex)));$('#overlay').classList.add('open')}function closeMenu(){$('#overlay').classList.remove('open')}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}$('#prev').onclick=()=>go(index-1);$('#next').onclick=advanceOrStart;$('#menu').onclick=openMenu;$('#closemenu').onclick=closeMenu;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeMenu()};$('#sound').onclick=()=>{soundEnabled=!soundEnabled;$('#sound').textContent=soundEnabled?'🔊 Sound':'🔇 Muted'};$('#fullscreen').onclick=full;document.addEventListener('keydown',e=>{if(['BUTTON','INPUT'].includes(document.activeElement.tagName)&&e.key===' ')document.activeElement.blur();if($('#overlay').classList.contains('open')){if(e.key==='Escape')closeMenu();return}if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();if(!e.repeat)advanceOrStart()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}else if(e.code==='Space'){e.preventDefault();playPause()}else if(e.key.toLowerCase()==='r'){reset()}else if(e.key.toLowerCase()==='f'){full()}else if(e.key==='Escape'){closeMenu()}});render();
</script></body></html>
